version: "2.0"
status: canonical-working-baseline
last_updated: "2026-08-18"

status_vocabulary:
  MANDATORY: baseline capability or fabric must exist
  MANDATORY_SUPPORT: provider adapter must be supported but remains replaceable
  OPTIONAL: useful non-required provider or backend
  WATCH: not yet mature or reproducible enough for baseline runtime use
  EXCLUDED_AS_AUTHORITY: integration allowed but authority takeover forbidden

authorities:
