      - quantization
      - cpu_gpu_offload
      - few_step_or_distilled_execution
      - cache_acceleration
      - speculative_decoding
      - hardware_aware_sparse_attention
    hardware_gates:
      - provider: Tencent-Hunyuan/flex-block-attn
        rule: enable_only_on_supported_gpu_architectures
        fallback_required: true

