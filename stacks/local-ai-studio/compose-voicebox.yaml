# Optional headless/CPU Voicebox service.
# Native Voicebox is preferred on KDE/Wayland when global dictation,
# host audio and local GPU inference are required.
name: ai-studio-voicebox

services:
  voicebox:
    build:
      context: "${VOICEBOX_SRC:?Set VOICEBOX_SRC}"
    image: voicebox:local
    container_name: ai-voicebox
    restart: unless-stopped
    ports:
      - "127.0.0.1:17600:17493"
    volumes:
      - "${VOICEBOX_OUTPUT_DIR:?Set VOICEBOX_OUTPUT_DIR}:/app/data/generations"
      - voicebox-data:/app/data
      - "${VOICEBOX_HF_CACHE:?Set VOICEBOX_HF_CACHE}:/home/voicebox/.cache/huggingface"
    environment:
      LOG_LEVEL: "${VOICEBOX_LOG_LEVEL:-info}"
      NUMBA_CACHE_DIR: "/tmp/numba_cache"
    mem_limit: "${VOICEBOX_MEM_LIMIT:-8g}"
    cpus: "${VOICEBOX_CPUS:-4.0}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:17493/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  voicebox-data:
    name: voicebox-data
